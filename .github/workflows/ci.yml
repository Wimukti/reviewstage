name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard (unit + build + browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard-ui/pnpm-lock.yaml
      # Web push signs and encrypts with `cryptography` (RFC 8291/8292); the runner's python
      # happens to ship it today, but a job must not depend on that.
      - run: python3 -m pip install --user --break-system-packages "cryptography>=42" || python3 -m pip install --user "cryptography>=42"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # The browser suite is where the interface is actually specified — focus rings, the phone
      # tab bar, the commit bar, every redesign guarantee. It ran only on developer machines, so
      # nothing stopped a regression reaching main.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  image:
    name: Docker image (builds + boots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The image build is the only thing that exercises the Dockerfile's own view of the tree.
      # A bundle import reaching outside dashboard-ui once broke every install while the
      # dashboard job stayed green, because that job builds in a full checkout.
      - name: Build the image
        run: docker build -t reviewstage:ci .
      - name: It boots and answers /health
        run: |
          docker run -d --name rs-ci -e RS_SECRET=ci-secret-that-is-long-enough-to-pass \
            -e REPOS=acme/widgets -e PUBLIC_URL=http://127.0.0.1:8080 \
            -p 8080:8899 reviewstage:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health && break || sleep 2
          done
          curl -sf http://127.0.0.1:8080/health
          docker rm -f rs-ci

  desktop:
    name: Desktop (npx reviewstage smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: dashboard-ui
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      # The app refuses to start without Claude Code on PATH, as on a user's machine.
      - name: Claude Code and xvfb
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: Assemble the package (dashboard build + server/)
        run: node scripts/prepack.mjs
        working-directory: desktop
      # pnpm skips electron's postinstall; fetch the binary once here so no test file downloads
      # it while another spawns it (node runs test files in parallel -> ETXTBSY).
      - name: Fetch the Electron binary
        working-directory: desktop
        run: node -e "require('electron')"
      - name: Tools, tunnel and the real Electron launch
        run: xvfb-run -a node --test --test-reporter=spec test/*.test.mjs
        working-directory: desktop

  scripts:
    name: Scripts (compile + syntax + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Python compiles
        run: python3 -m py_compile bin/*.py
      # Web push signs and encrypts with `cryptography` (RFC 8291/8292); the runner's python
      # happens to ship it today, but a job must not depend on that.
      - name: cryptography for the push tests
        run: python3 -m pip install --user --break-system-packages "cryptography>=42" || python3 -m pip install --user "cryptography>=42"
      - name: Python unit tests
        run: python3 -m unittest discover -s bin -p 'test_*.py'
      - name: Webhook end-to-end (real server, curl + openssl)
        run: bash bin/test-webhook-e2e.sh
      - name: Bash parses
        run: bash -n bin/*.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./bin
          severity: warning
