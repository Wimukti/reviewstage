# ReviewStage — Docker Compose.
#
#   docker compose up -d                  personal mode: the dashboard only
#   docker compose --profile team up -d   + the poller (Slack cards for review requests)
#   docker compose up demo                offline demo, no credentials (see docs/INSTALL-DOCKER.md)
#   docker compose exec app doctor        diagnostics inside the running container
#
# Configuration comes from ./.env (copy .env.example). The dashboard listens on
# 127.0.0.1:8899 only — put Caddy / Tailscale / Cloudflare in front for anything remote
# (deploy/README.md).
#
# To publish it on a different HOST port, set RS_HOST_PORT (NOT RS_PORT) in .env:
#
#     RS_HOST_PORT=9100
#
# Compose reads .env twice — once to interpolate ${...} here and once as env_file for the
# container — so RS_PORT in .env used to do both at once: it moved the server inside the
# container AND the publish target, but only one of them consistently, and the install broke
# with nothing listening. The container's port is pinned to 8899 below and is not
# configurable from .env; RS_HOST_PORT only changes where it is published.

x-logging: &logging
  # Docker's default json-file driver is unbounded: a container left running for months fills
  # the disk with its own stdout.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  build: .
  image: reviewstage:local
  env_file:
    - path: .env
      required: false
  environment:
    # Pinned: the listen port inside the container is part of the image contract (healthcheck,
    # EXPOSE, the port published below). An RS_PORT in .env must not move it.
    RS_PORT: "8899"
  volumes:
    - reviewstage-data:/home/reviewstage/.reviewstage
  restart: unless-stopped
  init: true
  logging: *logging

services:
  app:
    <<: *app
    command: server
    ports:
      - "127.0.0.1:${RS_HOST_PORT:-8899}:8899"

  # Optional: finds PRs awaiting each signed-in user's review and posts the Slack cards.
  # Without it the dashboard still works — you just open it yourself.
  poller:
    <<: *app
    command: poller
    profiles: [team]
    depends_on:
      app:
        condition: service_healthy
    # The image's healthcheck probes the dashboard port; this container has no server.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "poller-loop.sh"]
      interval: 60s

  # Offline demo against a fixture: no GitHub token, no Claude account. Separate volume so it
  # never mixes with real data. `docker compose up demo` (naming the service enables its profile).
  demo:
    build: .
    image: reviewstage:local
    command: demo
    profiles: [demo]
    environment:
      RS_PORT: "8899"
    ports:
      - "127.0.0.1:${RS_HOST_PORT:-8899}:8899"
    volumes:
      - reviewstage-demo:/home/reviewstage/.reviewstage
    init: true
    logging: *logging

volumes:
  reviewstage-data:
  reviewstage-demo:
