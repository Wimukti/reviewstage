<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0b12">
<title>ReviewStage — offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0a0b12;color:#e9ebf3;font:15px/1.65 -apple-system,system-ui,"Segoe UI",sans-serif;
    padding:24px;text-align:center}
  .box{max-width:360px}
  img{width:56px;height:56px;display:block;margin:0 auto 18px}
  h1{font-size:1.25rem;margin:0 0 8px;letter-spacing:-.02em}
  p{color:#9aa0b4;margin:0 0 20px}
  button{background:linear-gradient(135deg,#5b7cfa 0%,#6a65ec 100%);color:#fff;border:0;
    border-radius:11px;padding:10px 18px;font-size:.9rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="/icons/icon-192.png" alt="">
  <h1>ReviewStage needs a connection to your server</h1>
  <p>Reviews, the queue and posting all live on your team's server. Reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
