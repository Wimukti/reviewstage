# ReviewStage — Docker Compose.
#
#   docker compose up -d                  personal mode: the dashboard only
#   docker compose --profile team up -d   + the poller (Slack cards for review requests)
#   docker compose up demo                offline demo, no credentials (see docs/INSTALL-DOCKER.md)
#   docker compose exec app doctor        diagnostics inside the running container
#
# Configuration comes from ./.env (copy .env.example). The dashboard listens on
# 127.0.0.1:8899 only — put Caddy / Tailscale / Cloudflare in front for anything remote
# (deploy/README.md).

x-app: &app
  build: .
  image: reviewstage:local
  env_file:
    - path: .env
      required: false
  volumes:
    - reviewstage-data:/home/reviewstage/.reviewstage
  restart: unless-stopped
  init: true

services:
  app:
    <<: *app
    command: server
    ports:
      - "127.0.0.1:${RS_PORT:-8899}:8899"

  # Optional: finds PRs awaiting each signed-in user's review and posts the Slack cards.
  # Without it the dashboard still works — you just open it yourself.
  poller:
    <<: *app
    command: poller
    profiles: [team]
    depends_on:
      app:
        condition: service_healthy
    # The image's healthcheck probes the dashboard port; this container has no server.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "poller-loop.sh"]
      interval: 60s

  # Offline demo against a fixture: no GitHub token, no Claude account. Separate volume so it
  # never mixes with real data. `docker compose up demo` (naming the service enables its profile).
  demo:
    build: .
    image: reviewstage:local
    command: demo
    profiles: [demo]
    ports:
      - "127.0.0.1:${RS_PORT:-8899}:8899"
    volumes:
      - reviewstage-demo:/home/reviewstage/.reviewstage
    init: true

volumes:
  reviewstage-data:
  reviewstage-demo:
