<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<title>ReviewStage — your Mac isn't reachable</title>
<!-- Served by the service worker when the page itself cannot load: the Mac is asleep, the app
     quit, or the tunnel's address changed. Same words as the in-app state (src/reach.ts).
     Self-contained: the bundle and its stylesheet may not be reachable either. -->
<script>
  // The theme the person picked in the app (src/theme.ts, key rs-theme); dark when none.
  try { document.documentElement.setAttribute("data-theme", localStorage.getItem("rs-theme") || "dark"); } catch (e) {}
</script>
<style>
  /* The app's tokens (src/tokens.css): dark by default, light when picked or system-light. */
  :root{--paper:#0B0C10;--ink:#ECEEF3;--graphite:#9AA0B4;--blue:#7A83FF;--blue-ink:#0B0C10;color-scheme:dark}
  :root[data-theme="light"]{--paper:#F6F6F9;--ink:#171922;--graphite:#5A5F73;--blue:#3947FF;--blue-ink:#FFFFFF;color-scheme:light}
  @media (prefers-color-scheme: light){
    :root[data-theme="system"]{--paper:#F6F6F9;--ink:#171922;--graphite:#5A5F73;--blue:#3947FF;--blue-ink:#FFFFFF;color-scheme:light}
  }
  *{box-sizing:border-box}
  html{font-size:14px}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);font:1rem/1.6 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
    padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;-webkit-font-smoothing:antialiased}
  .box{max-width:360px;display:flex;flex-direction:column;align-items:center}
  img{width:56px;height:56px;border-radius:14px;display:block;margin:0 0 20px}
  h1{font-size:1.43rem;line-height:1.3;font-weight:600;margin:0;letter-spacing:-.02em}
  p{color:var(--graphite);margin:8px 0 0;font-size:1rem}
  button{margin-top:24px;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;
    background:var(--blue);color:var(--blue-ink);border:0;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  button svg{width:16px;height:16px}
  .small{margin-top:24px;font-size:.86rem}
</style>
</head>
<body>
<main class="box" data-testid="offline">
  <img src="/icons/icon-192.png" alt="">
  <h1>Your Mac isn't reachable</h1>
  <p>The phone reaches ReviewStage on your Mac. Open it there — or wake the Mac — and try again.</p>
  <button type="button" onclick="location.reload()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
    Try again
  </button>
  <p class="small">If ReviewStage was restarted, open the newest link from your notifications or scan a new code.</p>
</main>
</body>
</html>
