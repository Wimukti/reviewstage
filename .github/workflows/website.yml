name: website

on:
  push:
    branches: [main]
    # The site ships the dashboard's replay build (website/scripts/build-replay.mjs), so a
    # change to the PR page or the replay fixtures rebuilds the site too.
    paths:
      - "website/**"
      - "dashboard-ui/src/**"
      - "dashboard-ui/fixtures/**"
      - "dashboard-ui/scripts/build-replay.mjs"
      - "dashboard-ui/package.json"
      - "dashboard-ui/pnpm-lock.yaml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap's <lastmod> and the JSON-LD softwareVersion read git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            website/pnpm-lock.yaml
            dashboard-ui/pnpm-lock.yaml
      # The replay (/try/) is built from dashboard-ui by `pnpm build` in website/, so the
      # dashboard's dependencies have to be installed too.
      - run: pnpm install --frozen-lockfile
        working-directory: dashboard-ui
      - run: pnpm install --frozen-lockfile
        working-directory: website
      - run: pnpm build
        working-directory: website
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
